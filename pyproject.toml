[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codecal"
version = "2.0"
description = "Reliability-based calibration of partial factors — a didactic implementation (JCSS CodeCal 2.0)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jochen Köhler", email = "jochen.kohler@ntnu.no"}]
readme = "README.md"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "streamlit>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupytext>=1.16", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
include = ["codecal*"]
